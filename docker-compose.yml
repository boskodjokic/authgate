# Local development dependencies. The service itself is expected to run from your IDE or
# `./gradlew :server:bootRun` against these.
#
# Nothing in phase 0 connects to either container yet — Postgres is wired up in phase 1 and
# Mailhog in phase 2. They are declared now so the dev environment is one command ahead of the
# code rather than one behind it.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authgate
      POSTGRES_USER: authgate
      POSTGRES_PASSWORD: authgate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authgate -d authgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outbound sign-in email in development so magic links can be clicked without
  # sending real mail. Web UI on http://localhost:8025, SMTP on 1025.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
