# Local development dependencies. Run the service itself from your IDE or with
# `./gradlew :server:bootRun` against these.
#
# Postgres is required. The mail catcher is optional: without `spring.mail.host` pointed at it the
# service writes sign-in links to its own log instead, and says so on every use.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authgate
      POSTGRES_USER: authgate
      POSTGRES_PASSWORD: authgate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authgate -d authgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outbound sign-in email in development so magic links can be clicked without
  # sending real mail. Web UI on http://localhost:8025, SMTP on 1025.
  #
  # Mailpit rather than the better-known MailHog: MailHog is archived upstream and ships amd64
  # images only, so on an Apple Silicon machine it runs under emulation. Mailpit is the maintained
  # successor, multi-arch, and listens on the same two ports.
  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
