name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      # The runner has a Docker daemon, so the Testcontainers-backed tests added from phase 1
      # onward run here even though they skip on a machine without one.
      - run: ./gradlew build --no-daemon
      # The Testcontainers suites skip themselves when no Docker daemon is present, which is the
      # right behaviour on a developer machine and a silent loss of coverage here. CI is the only
      # place the Flyway migration and the JPA mapping are ever checked against a real Postgres,
      # so a skip on this runner has to be a build failure rather than a green tick.
      - name: Fail if any test skipped
        run: |
          python3 - <<'PY'
          import glob, re, sys
          total = skipped = 0
          suites = 0
          for path in glob.glob('**/build/test-results/test/*.xml', recursive=True):
              header = re.search(r'<testsuite[^>]*>', open(path).read()).group(0)
              count = lambda key: int(re.search(key + r'="(\d+)"', header).group(1))
              name = re.search(r'name="([^"]+)"', header).group(1)
              suites += 1
              total += count('tests')
              skipped += count('skipped')
              print(f'{name}: {count("tests")} tests, {count("skipped")} skipped')
          print(f'TOTAL: {suites} suites, {total} tests, {skipped} skipped')
          # Zero results is the failure this check exists to catch as much as a skip is: an
          # up-to-date or cache-restored test task leaves no XML behind, and "nothing ran" would
          # otherwise pass silently.
          if suites == 0:
              sys.exit('No test results found — the test task did not run.')
          if skipped:
              sys.exit(f'{skipped} of {total} tests skipped on CI — Docker is expected here.')
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-jdk${{ matrix.java-version }}
          path: "**/build/reports/tests/**"
