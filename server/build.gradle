plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

description = 'AuthGate identity service'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    implementation 'org.flywaydb:flyway-core'
    // Flyway 10 split the database dialects out of the core artifact; without this the migration
    // fails at startup with "Unsupported Database: PostgreSQL".
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation libs.nimbus.jose.jwt

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform(libs.testcontainers.bom)
    testImplementation libs.testcontainers.junit
    testImplementation libs.testcontainers.postgresql
}

tasks.named('bootJar') {
    archiveFileName = 'authgate-server.jar'
}
