spring:
  application:
    name: authgate
  datasource:
    url: jdbc:postgresql://localhost:5432/authgate
    username: authgate
    password: authgate
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate is not permitted to alter it, so a mismatch between
      # entity and migration surfaces as a startup failure rather than as a silent column added
      # to production.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

authgate:
  issuer: http://localhost:8080
  access-token-ttl: 15m
  # Long-lived on purpose: it is what spares a user from signing in again. Single use plus rotation
  # plus reuse detection are what make that safe — see SessionService.
  refresh-token-ttl: 30d
  signing:
    # PKCS#8 PEM. Blank generates an ephemeral key at startup, which is fine for development and
    # broken for anything with more than one instance or more than one lifetime.
    private-key: ${AUTHGATE_SIGNING_KEY:}
  magic-link:
    # A bearer credential sitting in an inbox, so it does not get to live long.
    ttl: 10m
    audience: http://localhost:8080
    # The page the emailed link opens. It reads the token from the fragment and posts it to
    # /auth/magic-link/redeem — see MagicLinkController for why redemption is not a GET.
    # Defaults to the reference page this service serves, so the flow works from a fresh checkout.
    # Point it at your own application's page in a real deployment.
    redirect-base: ${AUTHGATE_REDIRECT_BASE:http://localhost:8080/signin/}
    from: no-reply@localhost
  federation:
    # `aud` of the token a federated exchange produces.
    audience: http://localhost:8080
    # Every provider below is verified by the same code. There is no per-vendor branch —
    # Google, Entra, Okta, Auth0, Cognito and Keycloak all publish the same discovery document.
    #
    #   - name: google
    #     issuer: https://accounts.google.com
    #     audience: ${GOOGLE_CLIENT_ID}
    #     tenant: acme
    #   - name: entra
    #     issuer: https://login.microsoftonline.com/${TENANT_ID}/v2.0
    #     audience: ${ENTRA_APP_ID}
    #     tenant: acme
    #     email-claim: preferred_username      # Entra v1 tokens put the address here
    #   - name: okta
    #     issuer: https://acme.okta.com/oauth2/default
    #     audience: api://default
    #     tenant: acme
    #     # Only for a provider authoritative for the domain. See FederationService.
    #     link-by-verified-email: true
    providers: []
  bootstrap:
    # Creates a superuser only when the database has no accounts at all. Not a credential — they
    # sign in by magic link like anyone else — so it is safe in a deployment manifest. Remove it
    # once you have made your own accounts.
    tenant: ${AUTHGATE_BOOTSTRAP_TENANT:default}
    email: ${AUTHGATE_BOOTSTRAP_EMAIL:}

server:
  port: 8080
  error:
    # Stack traces and exception classes are internal detail; an auth service should not narrate
    # its internals to an unauthenticated caller.
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        # Only health is public. Every other actuator endpoint stays off until phase 4 can put it
        # behind the admin role.
        include: health
  endpoint:
    health:
      show-details: never
